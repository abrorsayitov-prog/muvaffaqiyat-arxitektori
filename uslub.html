<!DOCTYPE html>
<html lang="uz">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Uslub | Muvaffaqiyat Arxitektori</title>
    <link rel="stylesheet" href="style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        .page-title { text-align: center; color: #c5a059; font-size: 32px; margin-bottom: 30px; letter-spacing: 2px; }
        .back-btn { display: inline-block; color: #c5a059; text-decoration: none; margin-bottom: 20px; font-size: 14px; border: 1px solid #c5a059; padding: 8px 15px; border-radius: 5px; transition: 0.3s; }
        .back-btn:hover { background: #c5a059; color: #0a0a0a; }
        
        .lessons-grid { display: flex; flex-direction: column; gap: 20px; max-width: 700px; margin: 0 auto; }
        .lesson-card { display: flex; align-items: center; background: rgba(255, 255, 255, 0.03); border: 1px solid rgba(197, 160, 89, 0.3); padding: 15px; border-radius: 8px; text-decoration: none; color: white; transition: 0.3s; }
        .lesson-card:hover { background: rgba(197, 160, 89, 0.1); border-color: #c5a059; transform: translateX(10px); }
        .lesson-card img { width: 120px; height: 80px; object-fit: cover; border-radius: 5px; margin-right: 20px; border: 1px solid #c5a059; }
        .lesson-info h3 { color: #c5a059; margin-bottom: 5px; font-size: 18px; }
        .lesson-info p { color: #b3b3b3; font-size: 14px; }
    </style>
</head>
<body>

    <div class="container">
        <a href="index.html" class="back-btn"><i class="fa-solid fa-arrow-left"></i> Orqaga</a>
        
        <h1 class="page-title">USLUB DARSLARI</h1>
        <p style="text-align: center; color: #b3b3b3; margin-bottom: 30px;">O'zini namoyish etish va libos madaniyati.</p>

        <!-- Uslub sahifasining asosiy rasmi (ixtiyoriy) -->
        <div style="text-align: center; margin-bottom: 40px;">
            <img src="uslub-rasm.jpg" alt="Uslub" style="width: 100%; max-width: 600px; border-radius: 10px; border: 1px solid #c5a059; box-shadow: 0 0 20px rgba(197, 160, 89, 0.3);">
        </div>

        <div class="lessons-grid">
            
            <!-- 1-Dars -->
            <a href="uslub-dars-1.html" class="lesson-card fade-in">
                <img src="https://via.placeholder.com/120x80/1a1a1a/c5a059?text=Dars+1" alt="Dars 1">
                <div class="lesson-info">
                    <h3>1. Erkaklar kostyumi sirlari</h3>
                    <p>Qaysi holatda qanday kostyum kiyish kerak?</p>
                </div>
            </a>

            <!-- 2-Dars -->
            <a href="uslub-dars-2.html" class="lesson-card fade-in">
                <img src="https://via.placeholder.com/120x80/1a1a1a/c5a059?text=Dars+2" alt="Dars 2">
                <div class="lesson-info">
                    <h3>2. Aksessuarlar va soatlar</h3>
                    <p>Soat — bu vaqt, uslub va obro' belgisi.</p>
                </div>
            </a>

            <!-- 3-Dars -->
            <a href="uslub-dars-3.html" class="lesson-card fade-in">
                <img src="https://via.placeholder.com/120x80/1a1a1a/c5a059?text=Dars+3" alt="Dars 3">
                <div class="lesson-info">
                    <h3>3. O'zini tutish madaniyati</h3>
                    <p>Nutq, imo-ishora va ishonchli qiyofa.</p>
                </div>
            </a>

        </div>
    </div>

    <script src="script.js"></script>
